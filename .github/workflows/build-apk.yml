name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Создаём Android-проект
        run: flutter create --org ru.deloest --project-name delo_est --platforms=android build_app

      - name: Копируем наш код
        run: |
          cp pubspec.yaml build_app/pubspec.yaml
          rm -rf build_app/lib
          mkdir build_app/lib
          cp main.dart api.dart build_app/lib/

      - name: Правим AndroidManifest
        run: python3 patch_manifest.py build_app/android/app/src/main/AndroidManifest.xml

      - name: Зависимости
        working-directory: build_app
        run: flutter pub get

      - name: Сборка APK
        working-directory: build_app
        run: flutter build apk --release

      - name: Сохраняем APK
        uses: actions/upload-artifact@v4
        with:
          name: delo-est-apk
          path: build_app/build/app/outputs/flutter-apk/app-release.apk
